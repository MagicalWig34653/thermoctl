<!DOCTYPE html>
<html lang="de" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titel %}thermoctl{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
    {#
    Skripte gehoeren in den Kopf, nicht ans Ende des Rumpfes. `hx-boost` tauscht bei
    jeder Navigation den Inhalt des <body> aus, und htmx fuehrt <script>-Tags im
    eingetauschten Inhalt erneut aus. Bootstrap registriert seine Menuebehandlung dann
    ein zweites Mal am `document`: Der Umschalter feuert doppelt, das Menue geht auf und
    im selben Klick wieder zu -- es sieht aus, als ginge es gar nicht mehr auf. Der Kopf
    wird nie ausgetauscht, also laeuft hier alles genau einmal.
    `defer`, weil die Dateien damit erst nach dem Parsen laufen und ihre Reihenfolge
    trotzdem erhalten bleibt.
    #}
    <script defer src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script defer src="/static/vendor/htmx/htmx.min.js"></script>
    <script defer src="/static/passkey.js"></script>
    <script>
        // Am `document`, nicht am `document.body`: htmx-Ereignisse blubbern bis dorthin,
        // und der Rumpf existiert zum Zeitpunkt dieses Skripts noch gar nicht.
        document.addEventListener("htmx:configRequest", function (ereignis) {
            const eintrag = document.cookie.split("; ").find(function (wert) {
                return wert.startsWith("thermoctl_csrf=");
            });
            if (eintrag) {
                ereignis.detail.headers["X-CSRF-Token"] = decodeURIComponent(eintrag.split("=")[1]);
            }
        });
    </script>
</head>
<body hx-boost="true">
<nav class="navbar sticky-top navbar-expand-lg bg-body-secondary bg-opacity-50 p-3 mb-4"
     style="backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)">
    <div class="container">
        <a class="navbar-brand" href="/">thermoctl</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#hauptnavigation" aria-controls="hauptnavigation"
                aria-expanded="false" aria-label="Navigation einblenden">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="hauptnavigation">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">Anlage</button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/zonen">Zonen</a></li>
                        <li><a class="dropdown-item" href="/geraete">Geräte</a></li>
                        <li><a class="dropdown-item" href="/modi">Modi</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">Verwaltung</button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/benutzer">Benutzer</a></li>
                        <li><a class="dropdown-item" href="/gruppen">Gruppen</a></li>
                        <li><a class="dropdown-item" href="/audit">Audit</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">Konto</button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/tokens">Tokens</a></li>
                        <li><a class="dropdown-item" href="/passkeys">Passkeys</a></li>
                        <li>
                            <form hx-post="/logout">
                                <button class="dropdown-item" type="submit">Abmelden</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container" style="max-width: {% block max_breite %}40rem{% endblock %};">
{% block inhalt %}{% endblock %}
</div>
</body>
</html>
