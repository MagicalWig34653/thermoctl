<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titel %}thermoctl{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
</head>
<body hx-boost="true">
<nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">thermoctl</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/benutzer">Benutzer</a>
            <a class="nav-link" href="/gruppen">Gruppen</a>
            <a class="nav-link" href="/tokens">Tokens</a>
            <a class="nav-link" href="/geraete">Geräte</a>
            <a class="nav-link" href="/zonen">Zonen</a>
            <a class="nav-link" href="/modi">Modi</a>
            <a class="nav-link" href="/audit">Audit</a>
        </div>
    </div>
</nav>
<div class="container" style="max-width: 40rem;">
{% block inhalt %}{% endblock %}
</div>
<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/htmx/htmx.min.js"></script>
<script>
document.body.addEventListener("htmx:configRequest", function (ereignis) {
    const eintrag = document.cookie.split("; ").find(function (wert) {
        return wert.startsWith("thermoctl_csrf=");
    });
    if (eintrag) {
        ereignis.detail.headers["X-CSRF-Token"] = decodeURIComponent(eintrag.split("=")[1]);
    }
});
</script>
</body>
</html>
