name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Das Image ist für beide Datenbanken identisch; außerhalb der Matrix wird
  # derselbe Bau nicht zweimal ausgeführt.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile .

  # Oberfläche (Svelte): Typprüfung, Tests, Build. Läuft vor dem Python-Lauf, der
  # Python-Job hängt davon ab. Das Docker-Image baut die Oberfläche selbst
  # (eigene Node-Stufe in docker/Dockerfile); docker.yml braucht daher nichts Zusätzliches.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Die gebaute Oberfläche ist Eingabe des Python-Laufs (Auslieferung aus static/app/).
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: thermoctl/web/static/app
          if-no-files-found: error

  pruefen:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datenbank: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: pruefen
          MARIADB_DATABASE: thermoctl_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: thermoctl/web/static/app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verbindungszeichenfolge setzen
        run: |
          if [ "${{ matrix.datenbank }}" = "sqlite" ]; then
            echo "THERMOCTL_TEST_DATABASE_URL=sqlite:///./test.db" >> "$GITHUB_ENV"
          else
            echo "THERMOCTL_TEST_DATABASE_URL=mysql+pymysql://root:pruefen@127.0.0.1:3306/thermoctl_test" >> "$GITHUB_ENV"
          fi
      - run: ruff check .
      - run: mypy thermoctl
      # Die Mindestschwelle gilt nur für die vollständige Suite und steht deshalb
      # hier statt in pyproject.toml -- sonst scheitert jeder Lauf einer einzelnen
      # Testdatei daran. Der Wert liegt knapp unter dem erreichten Stand: hoch genug,
      # dass ungetesteter Code auffällt, niedrig genug, dass er nicht grundlos blockt.
      - run: pytest -v --cov-fail-under=100
