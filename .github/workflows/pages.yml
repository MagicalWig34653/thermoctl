name: Seite

# Veröffentlicht `site/` (erzeugt von `tools/landingpage_erzeugen.py`) über GitHub Pages.
#
# Einmalig in den Repository-Einstellungen: Settings -> Pages -> "Build and deployment"
# -> Source: "GitHub Actions". Ohne diese Einstellung scheitert der Schritt
# "Veröffentlichen". Der Workflow läuft ausschließlich auf `main` und bei Handstart --
# nie für Pull Requests, damit aus einem fremden Zweig nichts veröffentlicht wird.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "thermoctl/data/glossar.json"
      - "tools/landingpage_erzeugen.py"
      - "tools/landingpage/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Standard: nur lesen. Die beiden Rechte, die das Veröffentlichen braucht, stehen
# unten ausschließlich an dem Job, der sie benutzt.
permissions:
  contents: read

# Ein Lauf nach dem anderen; ein laufendes Veröffentlichen wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      # Aktionen sind auf einen Commit festgelegt (Version im Kommentar): Ein Tag lässt
      # sich verschieben, ein Hash nicht.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      # Schlägt fehl, wenn site/ nicht zum Generator und zu glossar.json passt.
      - name: site/ ist aktuell
        run: python -m tools.landingpage_erzeugen --pruefen
      # Anker, Verweise nach außen, Lizenzangabe, keine Dritt-Ressourcen.
      - name: Invarianten der Seite
        run: pytest tests/test_landingpage.py -v

  veroeffentlichen:
    needs: pruefen
    # Nie aus einem Pull Request; auch ein Handstart auf einem anderen Zweig
    # veröffentlicht nichts.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
