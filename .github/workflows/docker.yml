name: Docker
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: marken
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest entsteht ausschliesslich aus einem Tag v*, nie aus einem Push auf
            # main. Wer das Image betreibt, zoege sonst mit jedem Zwischenstand einen
            # unfertigen Stand -- und bei einer selbst gehosteten Heizungssteuerung ist
            # das Image der Rueckfallpunkt, wenn ein Update schiefgeht.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Schaltet nur die automatische latest-Vergabe ab; die Zeile darueber setzt sie
          # gezielt.
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.marken.outputs.tags }}
          labels: ${{ steps.marken.outputs.labels }}
