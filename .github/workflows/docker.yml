name: Docker
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Für linux/arm64 auf dem amd64-Läufer: buildx allein baut nur für die
      # Architektur des Läufers, QEMU emuliert die fremde Architektur beim Bauen.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: marken
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest entsteht ausschließlich aus einem Tag v*, nie aus einem Push auf
            # main. Wer das Image betreibt, zöge sonst mit jedem Zwischenstand einen
            # unfertigen Stand -- und bei einer selbst gehosteten Heizungssteuerung ist
            # das Image der Rückfallpunkt, wenn ein Update schiefgeht.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Schaltet nur die automatische latest-Vergabe ab; die Zeile darüber setzt sie
          # gezielt.
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # aarch64 und amd64 -- die vom Projektinhaber entschiedenen Zielarchitekturen
          # für das Home-Assistant-Add-on (Raspberry Pi 4/5 und x86_64-Server/-NAS).
          # armv7 ausdrücklich nicht.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.marken.outputs.tags }}
          labels: ${{ steps.marken.outputs.labels }}
