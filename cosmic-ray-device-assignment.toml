# Runde 1, Rest der Domaene. Wiederholbarer Lauf aus dem Repository-Wurzelverzeichnis:
#
#   .venv/bin/cosmic-ray init --force cosmic-ray-device-assignment.toml /tmp/thermoctl-device-assignment.sqlite
#   .venv/bin/cr-filter-operators /tmp/thermoctl-device-assignment.sqlite cosmic-ray-device-assignment.toml
#   .venv/bin/cosmic-ray exec cosmic-ray-device-assignment.toml /tmp/thermoctl-device-assignment.sqlite
#   .venv/bin/cr-report /tmp/thermoctl-device-assignment.sqlite
[cosmic-ray]
module-path = "thermoctl/domain/device_assignment.py"
timeout = 10.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest --no-cov tests/test_device_assignment.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.distributor.local]
max-workers = 16

[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_BitOr_.*",
    "core/ReplaceComparisonOperator_Eq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_NotEq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Lt_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_LtE_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Gt_(Eq|NotEq|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_GtE_(Eq|NotEq|Lt|LtE|Is|IsNot)",
]
