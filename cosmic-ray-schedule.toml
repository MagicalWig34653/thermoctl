# Runde 1, Stufe 2 des Komplettreviews. Wiederholbarer Lauf aus dem
# Repository-Wurzelverzeichnis:
#
#   .venv/bin/cosmic-ray init --force cosmic-ray-schedule.toml /tmp/thermoctl-schedule.sqlite
#   .venv/bin/cr-filter-operators /tmp/thermoctl-schedule.sqlite cosmic-ray-schedule.toml
#   .venv/bin/cosmic-ray exec cosmic-ray-schedule.toml /tmp/thermoctl-schedule.sqlite
#   .venv/bin/cr-report /tmp/thermoctl-schedule.sqlite
#
# Fuer den ungefilterten Ausgangslauf wird der Filter-Schritt ausgelassen.
[cosmic-ray]
module-path = "thermoctl/domain/schedule.py"
timeout = 10.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest --no-cov tests/test_domain_schedule.py tests/test_schedule_views.py tests/test_domain_race.py tests/test_remote_control.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.distributor.local]
max-workers = 16

[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_BitOr_.*",
    "core/ReplaceComparisonOperator_Eq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_NotEq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Lt_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_LtE_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Gt_(Eq|NotEq|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_GtE_(Eq|NotEq|Lt|LtE|Is|IsNot)",
]
