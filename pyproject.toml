[project]
name = "thermoctl"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19",
    "pydantic-settings>=2.15",
    "argon2-cffi>=25.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pymysql>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.12", "ruff>=0.16", "mypy>=1.18"]

[project.scripts]
thermoctl = "thermoctl.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thermoctl*"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Von Alembic generierte Migrationsdateien sind kein handgepflegter Code — Import-
# Reihenfolge und ungenutzte op/sa-Importe (leere Migrationen) bleiben ungeprüft.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert ist in Tests erwünscht

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # Testpasswörter im Klartext sind hier in Ordnung
# tests/test_migrations.py ruft bewusst das `alembic`-CLI als Unterprozess auf, um
# echte Migrationsläufe zu prüfen; der Pfad ist auf .venv/bin eingeschränkt.
"tests/test_migrations.py" = ["S603", "S607", "F401"]
# migrations/env.py folgt der Alembic-Konvention: DB-Konfiguration vor Domänen-Importen,
# nicht alphabetisch nach Modulpfad.
"migrations/env.py" = ["I001"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["migration: laeuft Alembic als Unterprozess"]
