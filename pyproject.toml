[project]
name = "thermoctl"
version = "0.6.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19",
    "pydantic-settings>=2.15",
    "argon2-cffi>=25.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pymysql>=1.2",
    "aiomqtt>=2.4",
    # WebAuthn/Passkeys. Von Duo gepflegt, die Referenz im Python-Umfeld.
    "webauthn>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=6.0",
    "httpx2>=2.12",
    "ruff>=0.16",
    "mypy>=1.18",
    "cosmic-ray>=8.7,<9",
]
mcp = ["mcp>=1.2"]
# Eigene, von `dev` getrennte Gruppe: nur wer Browsertests laufen lassen will,
# braucht Playwright (und danach einmalig `playwright install`, s. README.md). Ein
# gewoehnlicher `pip install -e ".[dev]"` zieht das nicht mit.
browser-tests = ["playwright>=1.48"]

[project.scripts]
thermoctl = "thermoctl.cli:main"
thermoctl-mcp = "thermoctl.mcp.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thermoctl*"]

# Vorlagen und statische Dateien sind kein Beiwerk, sondern die halbe Anwendung.
# Ohne diesen Block installiert setuptools ausschliesslich `.py`-Dateien: Das
# Container-Abbild baute sauber durch und startete dann mit
# "Directory '.../thermoctl/web/static' does not exist" gar nicht erst -- und
# haette, waere es weiter gekommen, keine einzige Seite rendern koennen. Der
# CI-Schritt "Docker-Image-Build" weist das nicht nach; er beweist nur, dass sich
# ein Abbild bauen laesst, nicht dass es laeuft.
[tool.setuptools.package-data]
thermoctl = ["web/templates/*.html", "web/static/*", "web/static/vendor/*/*"]

[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert ist in Tests erwünscht

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # Testpasswörter im Klartext sind hier in Ordnung
# Ruft Alembic bewusst als Unterprozess auf, um echte Migrationsläufe zu prüfen.
"tests/test_migrations.py" = ["S603"]
# Von Alembic erzeugte Migrationen: Importreihenfolge und die mitgenerierten, in leeren
# Migrationen ungenutzten Importe `op`/`sa`. Bewusst nur diese beiden Regeln statt eines
# vollständigen Ausschlusses — Migrationen enthalten ab Aufgabe 7 handgepflegten Code,
# der geprüft gehört.
"migrations/versions/*" = ["I001", "F401"]
# migrations/env.py folgt der Alembic-Konvention: DB-Konfiguration vor Domänen-Importen,
# nicht alphabetisch nach Modulpfad.
"migrations/env.py" = ["I001"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
# Dritter Riegel gegen dieselben iCloud-Konfliktkopien wie unten bei coverage und
# pytest. Ohne ihn prueft mypy die Kopien mit -- am 2026-09-02 waren es 123 statt
# 107 Dateien, mit einem Fehler in einer Datei, die niemand importiert.
exclude = "(^|/)[^/]* [0-9]\\.py$"

[tool.coverage.run]
# Dieselben iCloud-Konfliktkopien wie beim --ignore-glob unten, hier aber aus einem
# anderen Grund: pytest sammelt nur Testdateien ein, die Abdeckungsmessung erfasst
# dagegen jede .py unter thermoctl/. Eine Kopie wie "statistics 2.py" wird von
# niemandem importiert, zaehlt aber als 42 ungepruefte Zeilen und drueckt die Suite
# unter die Schwelle von 100 Prozent -- was aussieht wie eine fehlende Pruefung und
# keine ist.
omit = ["*/* [0-9].py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Der Abdeckungsbericht laeuft immer mit, die Mindestschwelle steht dagegen in der CI
# (--cov-fail-under=100). Sonst scheitert jeder Lauf einer einzelnen Testdatei an einer
# Schwelle, die nur fuer die vollstaendige Suite gilt.
#
# 100 Prozent heisst hier nicht "jede Zeile ist geprueft", sondern "jede Zeile ist
# entweder geprueft oder traegt eine Begruendung". Die Ausnahmen stehen als
# `# pragma: no cover` samt Grund im Quelltext -- sichtbar und einzeln bestreitbar,
# statt als Prozentsatz, hinter dem niemand mehr nachsieht, was fehlt.
# `--ignore-glob`: iCloud legt beim Abgleich des Documents-Ordners Kopien der Form
# "test_deviation 2.py" an. Sie sind alte Staende, .gitignore haelt sie aus dem
# Repository heraus -- pytest sammelt sie aber trotzdem ein und laesst die Suite an
# Zusicherungen scheitern, die vor Wochen einmal gestimmt haben. Genau das ist
# zweimal passiert und hat beide Male erst wie ein echter Fehlschlag ausgesehen.
addopts = "-q --cov=thermoctl --cov-report=term-missing --ignore-glob='* [0-9].py'"
markers = [
    "migration: laeuft Alembic als Unterprozess",
    "packaging: baut ein Wheel und sieht hinein",
]
