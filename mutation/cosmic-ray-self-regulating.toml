# Achtung: Der Testbefehl unten verweist relativ auf .venv/bin/python. In einem
# Worktree ohne eigene Umgebung wird dadurch jeder Mutant INCOMPETENT, und
# cosmic-ray meldet null Ueberlebende -- ein gescheiterter Lauf sieht aus wie ein
# perfektes Ergebnis. Vorher einen .venv-Symlink anlegen und hinterher pruefen,
# dass kein test_outcome INCOMPETENT ist. Siehe CLAUDE.md.
# Runde 1, Stufe 4 des Komplettreviews. Wiederholbarer Lauf aus dem
# Repository-Wurzelverzeichnis:
#
#   .venv/bin/cosmic-ray init --force cosmic-ray-self-regulating.toml /tmp/thermoctl-self-regulating.sqlite
#   .venv/bin/cr-filter-operators /tmp/thermoctl-self-regulating.sqlite cosmic-ray-self-regulating.toml
#   .venv/bin/cosmic-ray exec cosmic-ray-self-regulating.toml /tmp/thermoctl-self-regulating.sqlite
#   .venv/bin/cr-report /tmp/thermoctl-self-regulating.sqlite
#
# Fuer den ungefilterten Ausgangslauf wird der Filter-Schritt ausgelassen.
[cosmic-ray]
module-path = "thermoctl/domain/self_regulating.py"
timeout = 10.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest --no-cov tests/test_self_regulating.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.distributor.local]
max-workers = 16

[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_BitOr_.*",
    "core/ReplaceComparisonOperator_Eq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_NotEq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Lt_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_LtE_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Gt_(Eq|NotEq|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_GtE_(Eq|NotEq|Lt|LtE|Is|IsNot)",
]
