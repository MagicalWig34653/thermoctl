# Achtung: Der Testbefehl unten verweist relativ auf .venv/bin/python. In einem
# Worktree ohne eigene Umgebung wird dadurch jeder Mutant INCOMPETENT, und
# cosmic-ray meldet null Überlebende -- ein gescheiterter Lauf sieht aus wie ein
# perfektes Ergebnis. Vorher einen .venv-Symlink anlegen und hinterher prüfen,
# dass kein test_outcome INCOMPETENT ist. Siehe CLAUDE.md.
[cosmic-ray]
module-path = "thermoctl/auth/kiosk.py"
timeout = 20.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest --no-cov tests/test_kiosk.py"
[cosmic-ray.distributor]
name = "local"
[cosmic-ray.distributor.local]
max-workers = 8
[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*", "core/ReplaceComparisonOperator_Eq_(Gt|GtE|Lt|LtE|Is|IsNot)", "core/ReplaceComparisonOperator_NotEq_(Gt|GtE|Lt|LtE|Is|IsNot)", "core/ReplaceComparisonOperator_Lt_(Eq|NotEq|Gt|GtE|Is|IsNot)", "core/ReplaceComparisonOperator_LtE_(Eq|NotEq|Gt|GtE|Is|IsNot)", "core/ReplaceComparisonOperator_Gt_(Eq|NotEq|Lt|LtE|Is|IsNot)", "core/ReplaceComparisonOperator_GtE_(Eq|NotEq|Lt|LtE|Is|IsNot)"]
