# Achtung: Der Testbefehl unten verweist relativ auf .venv/bin/python. In einem
# Worktree ohne eigene Umgebung wird dadurch jeder Mutant INCOMPETENT, und
# cosmic-ray meldet null Überlebende -- ein gescheiterter Lauf sieht aus wie ein
# perfektes Ergebnis. Vorher einen .venv-Symlink anlegen und hinterher prüfen,
# dass kein test_outcome INCOMPETENT ist. Siehe CLAUDE.md.
# Runde 1, Stufe 3 des Komplettreviews. Cosmic Ray akzeptiert genau einen Modulpfad
# je Sitzung; deshalb hat jede Zieldatei eine eigene Konfiguration. Die
# Sitzungsdatenbanken liegen nur unter /tmp und gehören nicht in die CI.
[cosmic-ray]
module-path = "thermoctl/domain/authz.py"
timeout = 20.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest --no-cov tests/test_authz.py tests/test_administration.py tests/test_admin_views.py tests/test_tokens.py tests/test_api.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.distributor.local]
max-workers = 8

[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_BitOr_.*",
    "core/ReplaceComparisonOperator_Eq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_NotEq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Lt_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_LtE_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Gt_(Eq|NotEq|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_GtE_(Eq|NotEq|Lt|LtE|Is|IsNot)",
]
