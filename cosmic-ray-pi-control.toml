# Mutationstest für die reinen PI-/Fensterfunktionen (Schritt 3 der PI-Umsetzung,
# docs/superpowers/specs/2026-09-02-pi-regelung-spezifikation.md, Abschnitt 9).
# Wiederholbarer Lauf aus dem Repository-Wurzelverzeichnis:
#
#   .venv/bin/cosmic-ray init --force cosmic-ray-pi-control.toml /tmp/thermoctl-pi-control.sqlite
#   .venv/bin/cr-filter-operators /tmp/thermoctl-pi-control.sqlite cosmic-ray-pi-control.toml
#   .venv/bin/cosmic-ray exec cosmic-ray-pi-control.toml /tmp/thermoctl-pi-control.sqlite
#   .venv/bin/cr-report /tmp/thermoctl-pi-control.sqlite
#
# Die Sitzungsdatenbank ist ein Laufartefakt und wird nicht eingecheckt.
[cosmic-ray]
module-path = "thermoctl/domain/pi_control.py"
timeout = 10.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest --no-cov tests/test_pi_control.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.distributor.local]
max-workers = 4

# Same tool-noise exclusion as cosmic-ray-control-loop.toml (see
# cosmic-ray-stage1-assessment.md): cross-type replacements that are not plausible
# Python mutants on Decimal/typed comparisons.
[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_BitOr_.*",
    "core/ReplaceComparisonOperator_Eq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_NotEq_(Gt|GtE|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Lt_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_LtE_(Eq|NotEq|Gt|GtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_Gt_(Eq|NotEq|Lt|LtE|Is|IsNot)",
    "core/ReplaceComparisonOperator_GtE_(Eq|NotEq|Lt|LtE|Is|IsNot)",
]
