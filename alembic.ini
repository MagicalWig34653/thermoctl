[alembic]
script_location = migrations

# Keine sqlalchemy.url hier — die Verbindungszeichenfolge kommt ausschliesslich aus
# der Umgebung (THERMOCTL_DATABASE_URL, gelesen von thermoctl.config.get_settings()
# in migrations/env.py). Damit stehen keine Zugangsdaten in einer eingecheckten Datei.

[post_write_hooks]

# Logging-Konfiguration. Wird ausschliesslich von migrations/env.py konsumiert.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
