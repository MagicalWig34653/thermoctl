# Achtung bei Startkonfigurationen in IDEs: Ein *absoluter* Pfad zu dieser Datei
# scheitert, sobald der Projektpfad ein Leerzeichen enthält -- PyCharm zerlegt die
# Zusatzargumente einer Testkonfiguration naiv an Leerzeichen, und aus
# "-c /Users/.../Code Projekte/..." werden zwei Argumente. Deshalb dort immer den
# relativen Pfad "-c browser_tests/pytest.ini" benutzen; das Arbeitsverzeichnis ist
# ohnehin die Projektwurzel.
[pytest]
# Eigene, von pyproject.toml unabhängige Konfiguration: Diese Suite startet einen
# echten Server und einen echten Browser, die gewöhnliche Suite (pyproject.toml,
# testpaths=["tests"]) darf das nicht.
#
# Kein `testpaths` hier -- es sah nach der naheliegenden Absicherung aus, war aber
# keine: Sobald `-c`/`--config-file` diese Datei benennt, wird pytests Rootdir das
# Verzeichnis dieser Datei, während das tatsächliche Aufrufverzeichnis (die
# Arbeitskopie-Wurzel) ein anderes bleibt. Bei diesem Auseinanderfallen ignoriert
# pytest `testpaths` project vollständig und durchsucht wortlos das
# Aufrufverzeichnis -- das zog beim Entwickeln zusätzlich die gesamte gewöhnliche
# Suite (rund 4300 Tests) mit hinein, nicht nur diese hier. Der einzige verlässliche
# Riegel ist deshalb, das Verzeichnis explizit auf der Kommandozeile zu nennen --
# `pytest -c browser_tests/pytest.ini browser_tests`, s. README.md unter
# "Browsertests". Ein Aufruf ohne dieses Argument ist ein Fehlaufruf, kein
# gewöhnlicher Testlauf.
addopts = -q -p no:cacheprovider
markers =
    browser: startet einen echten Server (eigene SQLite-Datenbank) und einen echten
        Browser via Playwright. Nur lokal, s. README.md unter "Browsertests".
